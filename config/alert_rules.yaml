alerts:
  - name: high_latency_p95
    severity: P2
    condition: 'p95(latency_ms where event == "response_sent") > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-l3a-alerts'
    owner: Nguyen Nguyen Phong
    slo: fast_successful_requests
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: P1
    condition: 'count(event == "request_failed") / count(event == "request_received") * 100 > 2'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-l3a-alerts'
    owner: Nguyen Nguyen Phong
    slo: fast_successful_requests
    runbook: docs/alerts.md#alert-2
  - name: cost_spike
    severity: P3
    condition: 'sum(cost_usd where event == "response_sent") over 1h > 2 * baseline_hourly_cost OR projected_daily_cost_usd > 2.5'
    duration: 15m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-l3a-alerts'
    owner: Nguyen Nguyen Phong
    slo: guardrails.daily_cost_usd_max
    runbook: docs/alerts.md#alert-3
